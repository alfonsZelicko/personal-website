<script>
  const sendToGiscus = config => {
    console.log('wtf');
    const iframe = document.querySelector("iframe.giscus-frame");
    if (iframe?.contentWindow) {
      iframe.contentWindow.postMessage({ giscus: { setConfig: config } }, "https://giscus.app");
    }
  };

  {{ $themeDark  := "css/giscus-dark.css" | absURL }}
  {{ $themeLight := "css/giscus-light.css" | absURL }}

  {{ if hugo.IsServer }}
    {{ $themeDark  = "gruvbox_dark" }}
    {{ $themeLight = "gruvbox_light" }}
  {{ end }}

  const themeDark  = "{{ $themeDark | safeJS }}";
  const themeLight = "{{ $themeLight | safeJS }}";

  window.addEventListener("message", event => {
    if (event.origin !== "https://giscus.app") return;
    if (!(typeof event.data === "object" && event.data.giscus)) return;

    const isDarkTheme = document.getElementById("theme-toggle").checked;
    sendToGiscus({ theme: isDarkTheme ? themeDark : themeLight });
  });

  window.addEventListener("app:prefs-changed", event => {
    const { source, newValue } = event.detail;
    if (source === "theme-toggle") {
      const newTheme = newValue ? themeDark : themeLight;
      sendToGiscus({ theme: newTheme });
    }
  });

  (() => {
    const isDarkTheme = document.getElementById("theme-toggle").checked;
    const initialTheme = isDarkTheme ? themeDark : themeLight;

    const script = document.getElementById("giscus-script");
    if (script) {
      script.setAttribute("data-theme", initialTheme);
    }
  })();
</script>

<script
  src="https://giscus.app/client.js"
  data-repo="alfonsZelicko/personal-website"
  data-repo-id="R_kgDOQps9WA"
  data-category="Announcements"
  data-category-id="DIC_kwDOQps9WM4C0PZs"
  data-mapping="pathname"
  data-strict="0"
  data-reactions-enabled="1"
  data-emit-metadata="0"
  data-input-position="bottom"
  data-theme="{{ "css/giscus-dark.css" | absURL }}"
  id="giscus-script"
  crossorigin="anonymous"
  async></script>
