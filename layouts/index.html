{{ define "content" }}
  <style>
    .home {
      text-align: center;
    }
    .home h1 {
      margin-bottom: 0;
    }
    .home p {
      font-family: "Special Elite", system-ui;
      font-size: 2.4rem;
      margin-top: 0;
      margin-bottom: 2rem;
      color: var(--color-quote-rgb);
    }
    .home ul {
      list-style: none;
      margin: 0;
      padding: 0;
    }
    .home li {
      display: inline-block;
      position: relative;
    }
    .home li a {
      margin: 0 0.6rem;
    }

    @media screen and (max-width: 800px) {
      .home p {
        font-size: 1.2em;
      }

      .home li a {
        margin: 0 0.2rem;
      }
    }
  </style>

  <section class="container centered">
    <div class="home">
      <h1>{{ .Site.Params.author }}</h1>
      <p>{{ .Site.Params.info }}</p>
      {{ with .Site.Params.social }}
        <ul>
          {{ range sort . }}
            <li><a href="{{ .url }}" target="{{ .target }}">{{ .name }}</a></li>
          {{ end }}
        </ul>
      {{ end }}
    </div>
  </section>
{{ end }}
