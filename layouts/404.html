{{ define "content" }}
  <style>
    .error {
      text-align: center;
    }
    .error h1 {
      font-size: 10rem;
      margin-bottom: 0.5rem;
    }
    .error h2 {
      font-size: 2rem;
    }

    h1 {
      animation: glitch-2 1s linear infinite;
    }

    h2 {
      animation: glitch-1 1s linear infinite;
      animation-delay: 0.2s;
    }

    p {
      margin: 0;
    }

    p.msg {
      animation: glitch-0 1s linear infinite;
      animation-delay: 0.4s;
    }

    @keyframes glitch-0 {
      2%,
      64% {
        transform: translate(-2px, -1px) skew(0deg);
      }
      4%,
      60% {
        transform: translate(-2px, 0) skew(0deg);
      }
      62% {
        transform: translate(2px, 0) skew(5deg);
      }
    }

    @keyframes glitch-1 {
      2%,
      64% {
        transform: translate(-2px, -1px) skew(0deg);
      }
      4%,
      60% {
        transform: translate(2px, -1px) skew(0deg);
      }
      62% {
        transform: translate(0, -1px) skew(5deg);
      }
    }

    @keyframes glitch-2 {
      2%,
      64% {
        transform: translate(2px, 3px) skew(0deg);
      }
      4%,
      60% {
        transform: translate(-2px, 0) skew(0deg);
      }
      62% {
        transform: translate(0, 0) skew(5deg);
      }
    }

    h1:before,
    h2:before,
    p:before,
    h1:after,
    h2:after,
    p.msg:after {
      content: attr(title);
      position: absolute;
    }
    h1:after,
    h2:after,
    p:after {
      top: 0;
      left: 48px;

      @media screen and (max-width: 800px) {
        left: 18px;
      }
    }

    h2:after {
      left: 65px;

      @media screen and (max-width: 800px) {
        left: 33px;
      }
    }

    h1:before,
    h2:before,
    p.msg:before {
      animation: glitchTop 2s linear infinite;
      clip-path: polygon(0 0, 100% 0, 100% 33%, 0 33%);
      -webkit-clip-path: polygon(0 0, 100% 0, 100% 33%, 0 33%);
    }

    h2:before {
      animation-delay: 0.3s;
      clip-path: none;
      -webkit-clip-path: none;
      opacity: 0.3;

      animation: glitchTop-0 4s linear infinite;
    }

    @keyframes glitchTop-0 {
      2%,
      64% {
        transform: translate(-10px, -2px);
      }
      4%,
      60% {
        transform: translate(4px, 2px);
      }
      62% {
        transform: translate(-5px, -1px) skew(13deg);
      }
    }

    @keyframes glitchTop {
      2%,
      64% {
        transform: translate(2px, -2px);
      }
      4%,
      60% {
        transform: translate(-2px, 2px);
      }
      62% {
        transform: translate(5px, -1px) skew(-13deg);
      }
    }

    h1:after,
    h2:after,
    p.msg:after {
      animation: glitchBottom 1.5s linear infinite;
      clip-path: polygon(0 57%, 100% 57%, 100% 100%, 0 100%);
      -webkit-clip-path: polygon(0 57%, 100% 57%, 100% 100%, 0 100%);
    }

    @keyframes glitchBottom {
      2%,
      64% {
        transform: translate(-2px, 0);
      }
      4%,
      60% {
        transform: translate(-2px, 0);
      }
      62% {
        transform: translate(-10px, -5px) skew(21deg);
      }
    }
  </style>

  <section class="container centered">
    <div class="error">
      <h1 title="404">404</h1>
      <h2 title="Page Not Found">Page Not Found</h2>
      <p class="msg">This page does not exist.</p>
      <p><a href="{{ .Site.BaseURL }}">⭠ Go to Homepage</a></p>
    </div>
  </section>
{{ end }}
