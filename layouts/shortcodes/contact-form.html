<form action="https://formspree.io/f/xlggdzqp" method="POST" id="contact-form">
  <p>
    <label> NAME: <input type="text" name="name" required /> </label>
  </p>
  <p>
    <label> EMAIL: <input type="email" name="email" required /> </label>
  </p>
  <p>
    <label> MESSAGE: <textarea name="message" required></textarea></label>
  </p>
  <p>
    <button type="submit" aria-label="Send message" id="pokus">SEND MESSAGE</button>
  </p>
  <div id="form-status">THANKS FOR MESSAGE</div>
</form>

<script>
  const form = document.getElementById("contact-form");
  const formStatus = document.getElementById("form-status");

  async function handleSubmit(event) {
    event.preventDefault();
    const data = new FormData(event.target);

    try {
      const response = await fetch(event.target.action, {
        method: "POST",
        body: data,
        headers: {
          Accept: "application/json",
        },
      });

      if (response.ok) {
        formStatus.innerHTML = "Thanks for message!";
        form.reset();
      } else {
        const errorData = await response.json();
        const errorMessage = errorData.errors
          ? errorData.errors.map(e => e.message).join(", ")
          : "Error during sending.";
        formStatus.innerHTML = `Oops! ${errorMessage}`;
        formStatus.classList.add("error");
      }
    } catch (error) {
      formStatus.innerHTML = "Network error. Try it again later.";
      formStatus.classList.add("error");
    } finally {
      formStatus.classList.add("show-message");
      setTimeout(() => {
        formStatus.classList.remove("show-message", "error");
      }, 3000);
    }
  }

  form.addEventListener("submit", handleSubmit);
</script>
